<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - TaskGame</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="login">
    <p>Crie sua conta para começar sua jornada</p>
    <div class="inputs">
      <div class="input">
        <label for="name">Nome</label>
        <input type="text" id="nome" maxlength="18" title="Máx: 18 caracteres"/>
      </div>
      <div class="input">
        <label for="email">Email</label>
        <input type="email" id="email"/>
      </div>
      <div class="input">
        <label for="password">Senha</label>
        <input type="password" id="password"/>
      </div>
    </div>
    <button class="btn" id="botaoLogin">Começar agora</button>
    <script src="script.js"></script>
  </body>
</html>
