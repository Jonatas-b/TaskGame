<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskGame</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kdam+Thmor+Pro&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="perfil">
      <h1 id="userName"></h1>
      <h2 id="nivel"></h2>
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="level">
      <div class="text">
        <p id="score"></p>
        <p style="color: #1e293b">XP</p>
      </div>
      <div class="progress" id="progressBar">
        <div class="markup"></div>
      </div>
    </div>
    <p class="motivation">
      Conclua tarefas, ganhe XP e mantenha sua sequência.
    </p>
    <div class="bar task"></div>
    <a class="btn" href="./lista.html">+ Nova Tarefa</a>
    <script src="script.js">
      user = carregarUsuario();
      if (user) atualizarPerfil(user);
    </script>
  </body>
</html>
